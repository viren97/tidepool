name: CI

on:
  push:
    branches: [main]
  # Any base branch, so stacked chunk PRs (base = another chunk/ branch) get checked too.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the Gradle wrapper jar checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Ubuntu runners have Docker, so Testcontainers (`integration`-tagged) tests can run here.
      # Once A3 splits the tag out of `test`, add `integrationTest` to this command.
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
